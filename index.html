<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Reprise · Coach Sport & Santé</title>
<meta name="theme-color" content="#0a0e14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Reprise">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<style>
:root{
  --bg:#0a0e14; --bg2:#0d1219; --card:#131a24; --card2:#1a2332; --card3:#212d40;
  --border:#263243; --border2:#324158;
  --txt:#e8eef6; --muted:#8395ab; --dim:#5c6b80;
  --accent:#34d17b; --accent2:#4da3ff;
  --warn:#e8a33d; --bad:#f56565; --gold:#f0c53d; --violet:#a78bfa;
  --grad-green:linear-gradient(135deg,#34d17b,#1fa864);
  --grad-blue:linear-gradient(135deg,#4da3ff,#2470d4);
  --grad-gold:linear-gradient(135deg,#f0c53d,#d99a1f);
  --grad-violet:linear-gradient(135deg,#a78bfa,#7c5cf0);
  --shadow:0 4px 24px rgba(0,0,0,.45);
  --r:16px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:16px;overscroll-behavior-y:none}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom));background:radial-gradient(1200px 500px at 50% -100px,#12203233,transparent),var(--bg)}
h1{font-size:1.15rem;font-weight:700}
h2{font-size:.98rem;font-weight:700;margin:20px 0 10px;letter-spacing:-.2px}
h3{font-size:.9rem;font-weight:600}
.app{max-width:560px;margin:0 auto;padding:12px 14px}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:8px 0 6px;position:sticky;top:0;background:linear-gradient(var(--bg) 75%,transparent);z-index:20}
.topbar .logo{font-weight:800;font-size:1.25rem;letter-spacing:-.6px}
.topbar .logo span{background:var(--grad-green);-webkit-background-clip:text;background-clip:text;color:transparent}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:15px;margin-bottom:12px;box-shadow:var(--shadow)}
.card.tight{padding:11px 13px}
.muted{color:var(--muted);font-size:.82rem}
.small{font-size:.78rem}
.dim{color:var(--dim)}
.row{display:flex;align-items:center;gap:8px}
.row.between{justify-content:space-between}
.grow{flex:1}
button{font-family:inherit;border:none;border-radius:11px;cursor:pointer;font-size:.9rem;transition:transform .12s,filter .15s,background .2s}
.btn{background:var(--card2);color:var(--txt);border:1px solid var(--border2);padding:10px 15px;font-weight:600}
.btn.primary{background:var(--grad-green);color:#04180c;border:none;box-shadow:0 3px 14px #34d17b33}
.btn.blue{background:var(--grad-blue);color:#031225;border:none;box-shadow:0 3px 14px #4da3ff33}
.btn.ghost{background:transparent;border:1px dashed var(--border2);color:var(--muted)}
.btn.mini{padding:6px 11px;font-size:.78rem;border-radius:9px}
.btn.icon{padding:7px 10px;font-size:.9rem}
.btn:active{transform:scale(.95)}
input,select{background:var(--card2);border:1px solid var(--border2);color:var(--txt);border-radius:10px;padding:10px 11px;font-size:16px;font-family:inherit;width:100%;transition:border-color .2s}
input:focus,select:focus{outline:none;border-color:var(--accent2)}
label.f{display:block;font-size:.73rem;color:var(--muted);margin:9px 0 4px;font-weight:600;text-transform:uppercase;letter-spacing:.4px}
@keyframes viewIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#view{animation:viewIn .28s ease}
.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(10,14,20,.92);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--border);display:flex;z-index:50;padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;background:none;color:var(--dim);padding:10px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.6rem;font-weight:600;border-radius:0;position:relative}
.nav button .ic{font-size:1.3rem;transition:transform .2s}
.nav button.on{color:var(--accent)}
.nav button.on .ic{transform:translateY(-2px) scale(1.12)}
.nav button.on::before{content:"";position:absolute;top:0;left:25%;right:25%;height:2.5px;background:var(--grad-green);border-radius:0 0 4px 4px}
.rankbar{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border2);border-radius:var(--r);padding:13px 15px;margin-bottom:12px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.rankbar::after{content:"";position:absolute;top:-40px;right:-40px;width:130px;height:130px;background:radial-gradient(circle,#34d17b1f,transparent 70%)}
.rankbar .rname{font-weight:800;font-size:1.02rem;letter-spacing:-.2px}
.rankbar .remoji{font-size:1.7rem;filter:drop-shadow(0 0 10px #f0c53d55);animation:glowPulse 3s ease-in-out infinite}
@keyframes glowPulse{0%,100%{filter:drop-shadow(0 0 6px #f0c53d44)}50%{filter:drop-shadow(0 0 14px #f0c53d88)}}
.xpbar{height:9px;background:var(--card3);border-radius:6px;overflow:hidden;margin-top:9px;position:relative}
.xpbar div{height:100%;background:var(--grad-gold);border-radius:6px;transition:width .7s cubic-bezier(.3,1,.4,1);position:relative;overflow:hidden}
.xpbar div::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,#ffffff44 50%,transparent 70%);animation:shimmer 2.4s infinite}
@keyframes shimmer{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.daynav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.daynav .dt{text-align:center}
.daynav .dt b{font-size:1.02rem;display:block;text-transform:capitalize}
.stat3{display:flex;gap:6px}
.stat3 button{flex:1;padding:8px 4px;font-size:.72rem;font-weight:700;background:var(--card2);color:var(--muted);border:1px solid var(--border2)}
.stat3 .on-fait{background:var(--grad-green);color:#04180c;border:none;box-shadow:0 2px 12px #34d17b44}
.stat3 .on-partiel{background:linear-gradient(135deg,#e8a33d,#c9821a);color:#1c1200;border:none}
.stat3 .on-saute{background:var(--card3);color:var(--dim)}
.exo{border-left:3px solid var(--accent2);margin-bottom:10px;transition:opacity .3s}
.exo.done{border-left-color:var(--accent);opacity:.82}
.exo.done .name::after{content:" ✓";color:var(--accent)}
.exo.skip{border-left-color:var(--border);opacity:.5}
.exo.painflag{border-left-color:var(--bad)}
.exo .name{font-weight:700;font-size:.95rem}
.exo .cat{font-size:.65rem;color:var(--muted);background:var(--card2);border:1px solid var(--border);border-radius:7px;padding:2px 8px;display:inline-block;margin-left:6px;vertical-align:1px}
.lastperf{font-size:.76rem;color:var(--accent2);margin-top:4px}
.presc{font-size:.8rem;color:var(--violet);margin-top:5px;font-weight:700}
.warmline{font-size:.75rem;color:var(--warn);margin-top:2px;font-weight:600}
.sugg{font-size:.76rem;color:var(--gold);margin-top:2px;font-weight:600}
.setrow{display:flex;gap:6px;margin-top:6px;align-items:center}
.setrow input,.setrow select{flex:1;padding:8px;text-align:center}
.setrow select{text-align:left}
.setrow .lbl{font-size:.7rem;color:var(--dim);width:38px;text-align:right;font-weight:700;flex-shrink:0}
.setchk{background:var(--card2);border:1px solid var(--border2);color:var(--dim);width:40px;flex-shrink:0}
.setchk.on{background:var(--grad-green);color:#04180c;border:none}
.waterbar{height:16px;background:var(--card2);border-radius:9px;overflow:hidden;margin:9px 0 2px;border:1px solid var(--border)}
.waterbar div{height:100%;background:var(--grad-blue);transition:width .5s cubic-bezier(.3,1,.4,1);border-radius:8px}
.suppgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}
.chk{display:flex;align-items:center;gap:8px;background:var(--card2);border:1px solid var(--border2);border-radius:11px;padding:10px;cursor:pointer;font-size:.82rem;font-weight:600;transition:all .2s}
.chk.on{border-color:var(--accent);background:linear-gradient(135deg,#34d17b1a,#34d17b08)}
.chk .box{width:19px;height:19px;border-radius:6px;border:2px solid var(--dim);display:flex;align-items:center;justify-content:center;font-size:.68rem;flex-shrink:0;transition:all .2s}
.chk.on .box{background:var(--grad-green);border-color:transparent;color:#04180c;transform:scale(1.08)}
.banner{border-radius:13px;padding:12px 14px;margin-bottom:12px;font-size:.85rem;line-height:1.45;border:1px solid;animation:viewIn .3s}
.banner.warn{background:linear-gradient(135deg,#e8a33d1c,#e8a33d09);border-color:#e8a33d66;color:#f2d191}
.banner.info{background:linear-gradient(135deg,#4da3ff1a,#4da3ff08);border-color:#4da3ff55;color:#aacdf5}
.banner b{display:block;margin-bottom:2px}
.timerdisp{font-size:1.5rem;font-weight:800;font-variant-numeric:tabular-nums}
.brief{background:linear-gradient(150deg,#4da3ff18,var(--card) 55%);border:1px solid #4da3ff55;border-radius:var(--r);padding:15px;margin-bottom:12px;box-shadow:var(--shadow)}
.brief .bh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.brief .cyc{font-size:.68rem;font-weight:800;padding:3px 10px;border-radius:8px;background:#4da3ff22;color:#aacdf5;border:1px solid #4da3ff55}
.brief .cyc.deload{background:#a78bfa22;color:#cdbcfa;border-color:#a78bfa66}
.quote{font-style:italic;color:#aacdf5;font-size:.83rem;border-left:3px solid var(--accent2);padding-left:10px;margin-top:11px;line-height:1.5}
.tipline{font-size:.8rem;color:var(--gold);margin-top:9px;line-height:1.45}
.fb3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.fb{padding:16px 8px;border-radius:14px;font-weight:800;font-size:.92rem;border:2px solid;line-height:1.7;background:transparent}
.fb.facile{border-color:#34d17b;color:#7fe0ac}
.fb.juste{border-color:#e8a33d;color:#f2d191}
.fb.dur{border-color:#f56565;color:#f8a0a0}
.focus{position:fixed;inset:0;background:var(--bg);z-index:90;display:flex;flex-direction:column;padding:calc(14px + env(safe-area-inset-top)) 18px calc(20px + env(safe-area-inset-bottom));animation:viewIn .25s;overflow-y:auto}
.focus .fhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.focus .fprog{display:flex;gap:4px;margin-bottom:18px}
.focus .fprog i{flex:1;height:4px;border-radius:3px;background:var(--card3)}
.focus .fprog i.d{background:var(--grad-green)}
.focus .fprog i.c{background:var(--accent2)}
.focus .fname{font-size:1.6rem;font-weight:800;letter-spacing:-.5px;margin-bottom:4px}
.focus .ftimer{font-size:3.4rem;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;margin:10px 0;background:var(--grad-blue);-webkit-background-clip:text;background-clip:text;color:transparent}
.fnav{display:flex;gap:10px;margin-top:auto;padding-top:16px}
.fnav .btn{flex:1;padding:15px;font-size:1rem}
.chartwrap{overflow:hidden}
svg text{fill:var(--muted);font-size:10px}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px;font-size:.72rem;color:var(--muted)}
.legend i{display:inline-block;width:11px;height:3px;border-radius:2px;margin-right:4px;vertical-align:middle}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:13px;box-shadow:var(--shadow)}
.tile .v{font-size:1.4rem;font-weight:800;letter-spacing:-.5px}
.tile .l{font-size:.68rem;color:var(--muted);margin-top:3px;font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.tile .d{font-size:.73rem;margin-top:4px;font-weight:600}
.up{color:var(--accent)}.down{color:var(--bad)}.flat{color:var(--muted)}
.ringwrap{display:flex;align-items:center;gap:16px}
.ring{position:relative;width:110px;height:110px;flex-shrink:0}
.ring svg{transform:rotate(-90deg)}
.ring .rv{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .rv b{font-size:1.7rem;font-weight:800}
.ring .rv span{font-size:.6rem;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:700}
.gauge{height:13px;border-radius:8px;background:linear-gradient(90deg,#4da3ff 0 26%,#34d17b 26% 60%,#e8a33d 60% 76%,#f56565 76% 100%);position:relative;margin:14px 0 4px}
.gauge .needle{position:absolute;top:-5px;width:4px;height:23px;background:#fff;border-radius:3px;box-shadow:0 0 8px #000;transition:left .6s cubic-bezier(.3,1,.4,1)}
.gaugelabels{display:flex;justify-content:space-between;font-size:.62rem;color:var(--dim)}
.heat{overflow-x:auto;padding-bottom:6px}
.heat svg{min-width:480px}
.modal-bg{position:fixed;inset:0;background:rgba(2,4,8,.72);backdrop-filter:blur(3px);z-index:100;display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:var(--card);border:1px solid var(--border2);border-radius:20px 20px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));width:100%;max-width:560px;max-height:86vh;overflow-y:auto;animation:slideUp .3s cubic-bezier(.3,1,.4,1)}
@keyframes slideUp{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
.modal h3{margin-bottom:12px;font-size:1.05rem}
.congrats{position:fixed;inset:0;background:rgba(2,4,8,.82);z-index:200;display:flex;align-items:center;justify-content:center;padding:24px;animation:fadeIn .25s}
.congrats .inner{background:linear-gradient(160deg,var(--card2),var(--card));border:2px solid var(--gold);border-radius:22px;padding:30px 24px;text-align:center;max-width:420px;animation:pop .4s cubic-bezier(.2,1.7,.4,1);box-shadow:0 0 60px #f0c53d33}
.congrats .emoji{font-size:3.2rem;margin-bottom:10px;animation:bounce .6s .2s}
@keyframes bounce{0%,100%{transform:translateY(0)}40%{transform:translateY(-12px)}70%{transform:translateY(-4px)}}
.congrats .msg{font-size:1.05rem;font-weight:700;line-height:1.45}
@keyframes pop{from{transform:scale(.55);opacity:0}to{transform:scale(1);opacity:1}}
.confetti{position:fixed;top:-20px;font-size:1.4rem;z-index:201;animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(112vh) rotate(760deg);opacity:.25}}
.toast{position:fixed;bottom:calc(90px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--card2);border:1px solid var(--accent);color:var(--txt);padding:12px 17px;border-radius:13px;font-size:.85rem;font-weight:600;z-index:150;max-width:90%;text-align:center;animation:pop .3s;box-shadow:var(--shadow)}
.trophygrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.trophy{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px;text-align:center;transition:all .25s}
.trophy.unlocked{border-color:#f0c53d77;background:linear-gradient(160deg,#f0c53d14,var(--card))}
.trophy .te{font-size:1.9rem;margin-bottom:4px}
.trophy.locked .te{filter:grayscale(1) brightness(.4)}
.trophy .tn{font-size:.78rem;font-weight:700}
.trophy.locked .tn{color:var(--dim)}
.trophy .td{font-size:.65rem;color:var(--muted);margin-top:3px;line-height:1.35}
.trophy .tdate{font-size:.6rem;color:var(--gold);margin-top:4px;font-weight:700}
.bosscard{background:linear-gradient(150deg,#a78bfa1e,var(--card) 55%);border:1px solid #a78bfa66;border-radius:var(--r);padding:15px;margin-bottom:12px;box-shadow:var(--shadow)}
.bossbar{height:11px;background:var(--card3);border-radius:7px;overflow:hidden;margin-top:9px}
.bossbar div{height:100%;background:var(--grad-violet);border-radius:7px;transition:width .7s cubic-bezier(.3,1,.4,1)}
.libitem{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--border)}
.libitem:last-child{border:none}
.streakrow{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:.85rem}
.streakrow:last-child{border:none}
.flame{color:var(--gold);font-weight:800}
.jok{background:#f0c53d1a;border:1px solid #f0c53d66;border-radius:9px;padding:2px 9px;font-size:.72rem;font-weight:700;color:var(--gold)}
.seg{display:flex;background:var(--card2);border-radius:12px;padding:3px;gap:3px;margin-bottom:14px;overflow-x:auto;border:1px solid var(--border)}
.seg button{flex:1;background:none;color:var(--muted);padding:8px 11px;font-size:.76rem;font-weight:700;border-radius:9px;white-space:nowrap}
.seg button.on{background:var(--card3);color:var(--txt);box-shadow:0 2px 8px rgba(0,0,0,.3)}
.adhbar{height:9px;background:var(--card2);border-radius:6px;overflow:hidden;margin-top:5px}
.adhbar div{height:100%;border-radius:6px;transition:width .6s}
.week-day{border:1px solid var(--border);border-radius:14px;padding:11px 13px;margin-bottom:9px;background:var(--card);box-shadow:var(--shadow)}
.week-day .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.week-day .exlist{font-size:.8rem;color:var(--muted);line-height:1.8}
.week-day .exlist .tag{background:var(--card2);border:1px solid var(--border);border-radius:7px;padding:2px 9px;margin:0 4px 4px 0;display:inline-flex;align-items:center;gap:6px}
.week-day .exlist .tag b{color:var(--txt);font-weight:500}
.week-day .exlist .tag .x{color:var(--bad);cursor:pointer;font-weight:700}
.emptymsg{text-align:center;color:var(--muted);padding:28px 12px;font-size:.85rem;line-height:1.55}
a{color:var(--accent2);text-decoration:none}
.recap li{margin:5px 0 5px 18px;font-size:.85rem}
.healthlist td{padding:6px 8px;font-size:.78rem;border-bottom:1px solid var(--border)}
.healthlist th{padding:6px 8px;font-size:.68rem;color:var(--dim);text-align:left;text-transform:uppercase;letter-spacing:.4px}
table{border-collapse:collapse;width:100%}
details summary{list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::before{content:"▸";display:inline-block;margin-right:6px;transition:transform .2s;color:var(--dim)}
details[open] summary::before{transform:rotate(90deg)}
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.photo-grid .ph{position:relative;border-radius:12px;overflow:hidden;aspect-ratio:3/4;border:2px solid transparent;cursor:pointer;background:var(--card2)}
.photo-grid .ph.sel{border-color:var(--accent)}
.photo-grid .ph img{width:100%;height:100%;object-fit:cover;display:block}
.photo-grid .ph .pd{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,#000c);font-size:.6rem;padding:8px 5px 4px;text-align:center;font-weight:700}
.photo-grid .ph .px{position:absolute;top:4px;right:4px;background:#000a;border-radius:7px;padding:2px 7px;font-size:.7rem;color:var(--bad)}
.compare{position:relative;border-radius:14px;overflow:hidden;margin-top:10px}
.compare img{width:100%;display:block}
.compare .topimg{position:absolute;inset:0}
.compare .topimg img{width:100%;height:100%;object-fit:cover}
.compare .cbar{position:absolute;top:0;bottom:0;width:3px;background:#fff;box-shadow:0 0 8px #000}
.compare .clab{position:absolute;top:8px;font-size:.65rem;font-weight:800;background:#000a;padding:3px 9px;border-radius:8px}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="logo">Re<span>prise</span></div>
    <div class="muted small" id="topDate"></div>
  </div>
  <div id="view"></div>
</div>
<nav class="nav">
  <button data-v="today" class="on"><span class="ic">📅</span>Jour</button>
  <button data-v="week"><span class="ic">🗓️</span>Semaine</button>
  <button data-v="health"><span class="ic">❤️</span>Santé</button>
  <button data-v="stats"><span class="ic">📊</span>Stats</button>
  <button data-v="more"><span class="ic">⚙️</span>Plus</button>
</nav>
<div id="focusRoot"></div>
<div id="modalRoot"></div>
<div id="congratsRoot"></div>
<script>
"use strict";
/* ============================================================
   REPRISE v3 — moteur de coaching, records rameur, vocal,

/* ---------- Store & migrations ---------- */
const LS_KEY = "fitapp";
let S = null;
function defaultState(){
  return {
    version: 3,
    settings: { poidsCible: 80, poidsDepart: 87, taille: 1.80, voice: true },
    exercises: JSON.parse(JSON.stringify(DEFAULT_EXERCISES)),
    template: { 1:[],2:[],3:[],4:[],5:[],6:[],0:[] },
    days: {}, health: {}, prs: {},
    xp: 0, trophies: {}, bossDone: {},
    congratsHist: [], milestones: {},
    coach: {}, pain: {}, raceRecords: {},
    jokers: 0, jokerCredits: {}, lastSweep: null,
    cycleStart: null, firstUse: null, lastDebrief: null, lastMonthly: null
  };
}
function load(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(!raw){ S = defaultState(); initV3Fields(); seedTemplate(); save(); return; }
    S = JSON.parse(raw);
    if(!S.version) S.version=1;
    if(S.version===1) migrateV1toV2();
    if(S.version===2) migrateV2toV3();
    ["milestones","congratsHist"].forEach(k=>{ if(!S[k]) S[k]=[]; });
    ["trophies","bossDone","coach","pain","raceRecords","jokerCredits"].forEach(k=>{ if(!S[k]) S[k]={}; });
    if(S.xp===undefined) S.xp=0;
    initV3Fields();
  }catch(e){ S = defaultState(); initV3Fields(); seedTemplate(); }
}
function initV3Fields(){
  if(!S.firstUse) S.firstUse=todayIso();
  if(!S.cycleStart){ S.cycleStart=weekId(todayIso()); }
  if(S.settings.voice===undefined) S.settings.voice=true;
  if(S.jokers===undefined) S.jokers=0;
  if(!S.customRaceDistances) S.customRaceDistances=[];
  if(!S.ergattaRecords) S.ergattaRecords={};
}
function migrateV1toV2(){
  S.version=2; S.trophies={}; S.bossDone={};
  let xp=0;
  Object.values(S.days).forEach(day=>{
    (day.blocks||[]).forEach(b=>{ if(b.status==="fait")xp+=XP.fait; else if(b.status==="partiel")xp+=XP.partiel; });
    if(day.water>=12) xp+=XP.water;
    if(day.supp && SUPPLEMENTS.every(s=>day.supp[s.id])) xp+=XP.supp;
  });
  xp += Object.keys(S.prs||{}).length*XP.pr;
  xp += Object.keys(S.health||{}).length*XP.measure;
  S.xp=xp;
  S.milestones=S.milestones||{}; S.congratsHist=S.congratsHist||[];
  seedTemplate();
  migrateV2toV3();
}
function migrateV2toV3(){
  S.version=3;
  S.coach={}; S.pain=S.pain||{}; S.raceRecords=S.raceRecords||{};
  S.jokers=S.jokers||0; S.jokerCredits=S.jokerCredits||{};
  S.firstUse=S.firstUse||todayIso();
  S.cycleStart=weekId(todayIso());
  S.lastSweep=todayIso();
  if(S.settings.voice===undefined) S.settings.voice=true;
  // Calibrage du coach depuis l'historique : reprend la dernière charge connue par exercice
  S.exercises.forEach(ex=>{
    if(ex.ut!=="sets") return;
    const h=historyFor(ex.id);
    if(!h.length) return;
    const lastKg=Math.max(0,...(h[h.length-1].b.sets||[]).map(s=>Number(s.kg)||0));
    if(lastKg>0){ const m=coachMeta(ex); S.coach[ex.id]={kg:evenClamp(lastKg), tgt:m.lo}; }
  });
  const pl=S.prs&&S.prs["planche"]&&S.prs["planche"].sec;
  if(pl) S.coach["planche"]={sec:Math.min(180,pl)};
  save();
  setTimeout(()=>{ checkTrophies(); }, 400);
}
function save(){ localStorage.setItem(LS_KEY, JSON.stringify(S)); }

/* Semaine type : haltères lun/mer/ven/dim · planche+abdos tous les jours */
function seedTemplate(){
  const id = n => S.exercises.find(e=>e.id===n) ? n : null;
  const F = a => a.filter(Boolean);
  const core = [id("planche"), id("abdos-classiques")];
  S.template[1] = F([id("rameur-entrainement"), id("goblet-squat"), id("developpe-couche"), id("developpe-militaire-debout"), id("fentes-arriere-halteres"), ...core]);
  S.template[2] = F([id("rameur-entrainement"), ...core, id("abdos-lateraux")]);
  S.template[3] = F([id("rameur-entrainement"), id("rowing-1-bras"), id("souleve-de-terre-roumain"), id("rowing-2-bras"), id("curl-marteau"), ...core]);
  S.template[4] = F([id("rameur-entrainement"), ...core, id("russian-twist-leste")]);
  S.template[5] = F([id("rameur-entrainement"), id("squat-2-halteres"), id("ecarte-couche"), id("developpe-arnold"), id("fentes-bulgares"), ...core]);
  S.template[6] = F([id("tennis"), ...core]);
  S.template[0] = F([id("rameur-course"), id("swing-haltere"), id("thruster"), id("pull-over"), ...core]);
}

/* ---------- Dates ---------- */
const DAYNAMES=["Dimanche","Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi"];
const MONTHS=["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
function iso(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function fromIso(s){ const[a,b,c]=s.split("-").map(Number); return new Date(a,b-1,c); }
function todayIso(){ return iso(new Date()); }
function addDays(s,n){ const d=fromIso(s); d.setDate(d.getDate()+n); return iso(d); }
function fmtDate(s){ const d=fromIso(s); return DAYNAMES[d.getDay()]+" "+d.getDate()+" "+MONTHS[d.getMonth()]; }
function fmtShort(s){ const d=fromIso(s); return d.getDate()+"/"+(d.getMonth()+1); }
function ym(s){ return s.slice(0,7); }
function weekId(dateIso){ const d=fromIso(dateIso); const dow=(d.getDay()+6)%7; d.setDate(d.getDate()-dow); return iso(d); }
function esc(t){ return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function uid(){ return Math.random().toString(36).slice(2,9); }
function fmtTime(sec){
  sec=Math.abs(sec);
  let base=Math.floor(sec);
  let cc=Math.round((sec-base)*100);
  if(cc===100){base+=1;cc=0;}
  const h=Math.floor(base/3600),m=Math.floor(base%3600/60),s=base%60;
  const frac=cc>0? ","+String(cc).padStart(2,"0") : "";
  return (h? h+"h"+String(m).padStart(2,"0")+":"+String(s).padStart(2,"0") : m+":"+String(s).padStart(2,"0"))+frac;
}
function fmtGap(sec){ sec=Math.abs(sec); return sec<60? sec.toFixed(2).replace(".",",")+" s" : fmtTime(sec); }
function fmtDist(d){ d=Number(d); return d>=1000? (d%1000===0? d/1000+" km" : (d/1000).toFixed(3).replace(".",",")+" km") : d+" m"; }

function coachMeta(ex){
  const n=(ex.name||"").toLowerCase(), cat=ex.cat;
  let m={db:2, start:6, rest:60, lo:8, hi:12, comp:false};
  if(cat==="Jambes/Fessiers"){
    m={db:2,start:10,rest:90,lo:8,hi:12,comp:true};
    if(n.includes("goblet")){m.db=1;m.start=12;}
    if(n.includes("mollets")){m={db:2,start:10,rest:60,lo:12,hi:20,comp:false};}
    if(n.includes("jump")){m={db:1,start:6,rest:90,lo:8,hi:12,comp:true};}
    if(n.includes("hip")){m.start=12;}
    if(n.includes("souleve")||n.includes("soulevé")){m.start=12;}
    if(n.includes("bulgare")||n.includes("marchée")||n.includes("marchees")){m.start=8;}
  } else if(cat==="Poussée"){
    m={db:2,start:8,rest:90,lo:8,hi:12,comp:true};
    if(n.includes("militaire")||n.includes("arnold")){m.start=6;}
    if(n.includes("ecarte")||n.includes("écarté")){m={db:2,start:4,rest:60,lo:10,hi:15,comp:false};}
    if(n.includes("elevation")||n.includes("élévation")){m={db:2,start:2,rest:60,lo:10,hi:15,comp:false};}
    if(n.includes("triceps")&&n.includes("nuque")){m={db:1,start:6,rest:60,lo:10,hi:15,comp:false};}
    if(n.includes("kickback")){m={db:2,start:2,rest:60,lo:10,hi:15,comp:false};}
  } else if(cat==="Tirage"){
    m={db:2,start:8,rest:90,lo:8,hi:12,comp:true};
    if(n.includes("1 bras")){m.db=1;m.start=10;}
    if(n.includes("curl")){m={db:2,start:6,rest:60,lo:8,hi:12,comp:false};}
    if(n.includes("concentre")||n.includes("concentré")){m.db=1;m.start=6;}
    if(n.includes("shrugs")){m={db:2,start:12,rest:60,lo:10,hi:15,comp:false};}
    if(n.includes("face pull")){m={db:2,start:4,rest:60,lo:10,hi:15,comp:false};}
    if(n.includes("renegade")){m={db:2,start:8,rest:90,lo:8,hi:12,comp:true};}
  } else if(cat==="Gainage"){
    m={db:1,start:6,rest:60,lo:10,hi:15,comp:false};
    if(n.includes("farmer")||n.includes("suitcase")){m={db:(n.includes("farmer")?2:1),start:14,rest:90,lo:20,hi:40,comp:false};}
    if(n.includes("pull")){m={db:1,start:8,rest:60,lo:10,hi:15,comp:false};}
    if(n.includes("side bend")){m={db:1,start:10,rest:60,lo:10,hi:15,comp:false};}
    if(n.includes("crunch")){m={db:1,start:4,rest:60,lo:10,hi:15,comp:false};}
    if(n.includes("russian")){m={db:1,start:6,rest:60,lo:16,hi:24,comp:false};}
  } else if(cat==="Corps Entier"){

}
function evenClamp(kg){ return Math.max(2, Math.min(32, Math.round(kg/2)*2)); }
function coachState(exId){
  if(!S.coach[exId]){
    const ex=exById(exId); const m=ex?coachMeta(ex):{start:6,lo:8};
    S.coach[exId]={kg:m.start, tgt:m.lo};
    save();
  }
  return S.coach[exId];
}
function weekIdx(dateIso){
  const d0=fromIso(S.cycleStart||weekId(todayIso()));
  const d1=fromIso(weekId(dateIso));
  return Math.round((d1-d0)/86400000/7);
}
function isDeload(dateIso){ const w=weekIdx(dateIso); return w>=0 && w%4===3; }
function autoReg(dateIso){
  const reasons=[];
  const r=acwr();
  if(r!==null&&r>1.5) reasons.push("charge en zone rouge (ACWR "+r.toFixed(2)+")");
  const fcS=healthSeries("fc");
  if(fcS.length>=4){
    const last=fcS[fcS.length-1]; const ma=movingAvg(fcS,7); const maL=ma[ma.length-1].v;
    if(last.v>maL+5) reasons.push("cœur au-dessus de sa base ("+last.v+" bpm)");
  }
  if(trainedDates().length>=4){

function prescribe(exId, dateIso, day){
  const ex=exById(exId); if(!ex) return null;
  const m=coachMeta(ex);
  const deload=isDeload(dateIso);
  const reg=(day&&day.reg)? day.reg.pct : 1;
  if(ex.ut==="sets"){
    const st=coachState(exId);
    let kg=evenClamp(st.kg*(deload?0.7:1)*reg);
    return {kg, reps:st.tgt||m.lo, sets:deload?2:3, rest:m.rest, db:m.db,
      warmup:(m.comp&&kg>=8)?{kg:evenClamp(kg*0.5),reps:10}:null,
      deload, reg:reg<1, atMax:st.kg>=32, m};
  }
  if(ex.ut==="sec"){
    const st=coachState(exId);
    if(!st.sec) st.sec = (exId==="planche" && S.prs["planche"]&&S.prs["planche"].sec) ? Math.min(180,S.prs["planche"].sec) : (exId==="planche"?45:30);
    let sec=Math.max(20, Math.round(st.sec*(deload?0.7:1)*reg/5)*5);
    return {sec, rest:60, deload, reg:reg<1, atMax:st.sec>=180};
  }
  if(ex.ut==="nb"){
    const st=coachState(exId);
    if(!st.nb) st.nb = exId==="pompes"?20:30;
    const cap = exId==="pompes"?60:75;
    let nb=Math.max(10, Math.round(st.nb*(deload?0.7:1)*reg/2)*2);
    return {nb, rest:60, deload, reg:reg<1, atMax:st.nb>=cap, cap};
  }
  return null;
}
function applyFeedback(exId, fb, block, dateIso){

  if(isDeload(dateIso)){ toast("🌙 Semaine de recharge — le coach fige la progression, reprise lundi"); save(); return; }

    else if(minReps>=m.hi && done.length>=2){

    }
    else {

      if(fb==="facile") st.tgt=Math.min(m.hi, st.tgt+1);
      toast("🎯 Coach : objectif "+st.tgt+" reps par série la prochaine fois");

  }
  else if(ex.ut==="sec"){
    const v=Number(block.sec)||0;
    if(fb==="dur") st.sec=Math.max(20,(st.sec||45)-10);

    if((st.nb||0)>=cap) toast("💪 Coach : plafond atteint — passe à la version lestée");

}

function epley(kg,reps){ return reps>0? kg*(1+reps/30) : 0; }
function e1rmFor(exId){

/* ---------- Charge & ACWR ---------- */
function dayLoad(day){
  let L=0;
  (day.blocks||[]).forEach(b=>{
    if(b.status!=="fait"&&b.status!=="partiel") return;
    const ex=exById(b.exId); if(!ex) return;
    const f=b.status==="partiel"?0.5:1;
    if(ex.ut==="sets") L+=f*(b.sets||[]).reduce((a,s)=>a+(Number(s.kg)||0)*(Number(s.reps)||0),0)/60;
    else if(ex.ut==="min") L+=f*(Number(b.min)||0);
    else if(ex.ut==="sec") L+=f*(Number(b.sec)||0)/12;
    else if(ex.ut==="nb") L+=f*(Number(b.nb)||0)/6;
  });
  return L;
}
function loadSeries(nDays){
  const out=[];
  for(let i=nDays-1;i>=0;i--){
    const d=addDays(todayIso(),-i);
    out.push({d, v: S.days[d]? dayLoad(S.days[d]) : 0});
  }
  return out;
}
function acwr(){
  const s=loadSeries(28);
  const chronic=s.reduce((a,p)=>a+p.v,0)/28;
  const acute=s.slice(-7).reduce((a,p)=>a+p.v,0)/7;
  if(chronic<1) return null;
  return acute/chronic;
}
function pushPullRatio(){
  let push=0,pull=0;
  const cutoff=addDays(todayIso(),-30);
  Object.keys(S.days).forEach(d=>{
    if(d<cutoff) return;
    (S.days[d].blocks||[]).forEach(b=>{
      if(b.status!=="fait"&&b.status!=="partiel") return;
      const ex=exById(b.exId); if(!ex||ex.ut!=="sets") return;
      const vol=(b.sets||[]).reduce((a,s)=>a+(Number(s.kg)||0)*(Number(s.reps)||0),0);
      if(ex.cat==="Poussée") push+=vol;
      if(ex.cat==="Tirage") pull+=vol;
    });
  });
  if(push<200) return null;
  return {push,pull,ratio: pull/push};
}

/* ---------- Score de forme ---------- */
function formScore(){
  let score=0, parts=[];
  const week=[...Array(7)].map((_,i)=>addDays(todayIso(),-6+i));
  let done=0,planned=0;
  week.forEach(d=>{
    const day=S.days[d]; if(!day||day.rest) return;
    const bl=(day.blocks||[]);
    if(!bl.length) return;
    planned+=bl.length;
    done+=bl.filter(b=>b.status==="fait").length + bl.filter(b=>b.status==="partiel").length*0.5;
  });
  const adh=planned? done/planned : 0.5;
  score+=adh*35; parts.push(["Adhérence 7j", Math.round(adh*35), 35]);
  const w=healthSeries("poids");
  let wPts=12;
  if(w.length>=2){
    const sl=slopePerWeek(w,14);
    if(sl!==null){
      if(sl<=-0.2&&sl>=-0.7) wPts=25;
      else if(sl<-0.7) wPts=14;
      else if(sl<0) wPts=18;
      else wPts=6;
    }
  }
  score+=wPts; parts.push(["Tendance poids", wPts, 25]);
  const fc=healthSeries("fc");
  let fcPts=8;
  if(fc.length>=3){
    const sl=slopePerWeek(fc,21);
    if(sl!==null){ fcPts = sl<=0? 15 : (sl<1.5? 10 : 4); }
  }
  score+=fcPts; parts.push(["Cœur au repos", fcPts, 15]);
  const r=acwr();
  let aPts=8;
  if(r!==null){ aPts = (r>=0.8&&r<=1.3)? 15 : (r<0.8? 9 : (r<=1.5? 6:2)); }
  score+=aPts; parts.push(["Charge équilibrée", aPts, 15]);
  const st=currentStreak(todayIso());
  const sPts=Math.min(10, st);
  score+=sPts; parts.push(["Streak", sPts, 10]);
  return {score:Math.round(score), parts};
}

function trainedDates(){

function currentStreak(upTo){

  const set=new Set(trainedDates());

    else if(passSet.has(d)){d=addDays(d,-1);}

function consecutiveTraining(upTo){

/* ---------- Santé : séries / interpolation / régression ---------- */
function healthSeries(field){
  return Object.keys(S.health).sort()
    .map(d=>({d,v:S.health[d][field]}))
    .filter(x=>x.v!==undefined&&x.v!==null&&x.v!=="")
    .map(x=>({d:x.d,v:Number(x.v)}));
}
function interpolate(series){
  if(series.length<2) return series.map(p=>({...p}));
  const out=[];
  for(let i=0;i<series.length-1;i++){
    const a=series[i],b=series[i+1];
    const days=Math.round((fromIso(b.d)-fromIso(a.d))/86400000);
    for(let k=0;k<days;k++) out.push({d:addDays(a.d,k), v:a.v+(b.v-a.v)*(k/days)});
  }
  out.push(series[series.length-1]);
  return out;
}
function movingAvg(series,win){
  const interp=interpolate(series);
  return interp.map((p,i)=>{
    const s=interp.slice(Math.max(0,i-win+1),i+1);
    return {d:p.d, v:s.reduce((a,x)=>a+x.v,0)/s.length};
  });
}
function slopePerWeek(series,lastNdays){
  const interp=interpolate(series);
  if(!interp.length) return null;
  const cutoff=addDays(interp[interp.length-1].d,-lastNdays);
  const pts=interp.filter(p=>p.d>=cutoff);
  if(pts.length<3) return null;
  const t0=fromIso(pts[0].d).getTime();
  const xs=pts.map(p=>(fromIso(p.d).getTime()-t0)/86400000), ys=pts.map(p=>p.v);
  const n=xs.length,sx=xs.reduce((a,b)=>a+b,0),sy=ys.reduce((a,b)=>a+b,0);
  const sxy=xs.reduce((a,x,i)=>a+x*ys[i],0),sxx=xs.reduce((a,x)=>a+x*x,0);
  const denom=n*sxx-sx*sx;
  if(Math.abs(denom)<1e-9) return null;
  return ((n*sxy-sx*sy)/denom)*7;
}
function projection80(){
  const w=healthSeries("poids");
  if(w.length<2) return null;
  const target=S.settings.poidsCible;
  const last=w[w.length-1];
  if(last.v<=target) return {done:true};
  const slope=slopePerWeek(w,30);
  if(slope===null||slope>=-0.05) return {stalled:true,current:last.v};
  const weeks=(last.v-target)/(-slope);
  const dt=fromIso(last.d); dt.setDate(dt.getDate()+Math.round(weeks*7));
  return {date:iso(dt),weeks,slope,current:last.v};
}

/* ---------- Le Bookmaker : cote sur chaque tentative de record ---------- */
function bookOdds(dist){
  const rec=S.raceRecords[dist];
  if(!rec) return null;
  let p=0.25;
  const fs=formScore().score;
  p*=(0.6+fs/100*0.9);
  const r=acwr();
  if(r!==null){ if(r>1.5)p*=0.6; else if(r>1.3)p*=0.85; else if(r<0.8)p*=0.9; }
  if(isDeload(todayIso())) p*=0.5;
  const day=S.days[todayIso()];
  if(day&&day.reg) p*=0.7;
  const age=Math.round((fromIso(todayIso())-fromIso(rec.date))/86400000);
  p*=Math.min(1.6, 1+age/90*0.3);
  const cut=addDays(todayIso(),-14);
  let mom=0;
  Object.values(S.raceRecords).forEach(x=>{if(x.date&&x.date>=cut)mom++;});
  Object.values(S.prs).forEach(x=>{if(x.date&&x.date>=cut)mom++;});
  p*=Math.min(1.35, 1+mom*0.05);
  let lastRow=null;
  Object.keys(S.days).sort().forEach(d=>{(S.days[d].blocks||[]).forEach(b=>{if(b.exId&&b.exId.startsWith("rameur")&&(b.status==="fait"||b.status==="partiel"))lastRow=d;});});
  if(lastRow){const g=Math.round((fromIso(todayIso())-fromIso(lastRow))/86400000); if(g>=7)p*=0.75; else if(g<=2)p*=1.05;}
  p=Math.max(0.02, Math.min(0.75, p));
  const raw=Math.max(1.05, 0.95/p);
  const o=raw<10? Math.round(raw*10)/10 : Math.round(raw);
  let label;
  if(o<2) label="🔥 favori — le book te voit passer";
  else if(o<4) label="🎯 jouable — belle value si tu es dans un bon jour";
  else if(o<8) label="😤 outsider — il faudra un vrai coup de rame";
  else label="🚀 exploit — cote de folie, gloire éternelle si ça passe";
  return {odds:o, label, p};
}

function checkPR(block){
  const ex=exById(block.exId); if(!ex) return false;
  const pr=S.prs[ex.id]||{};
  let msg=null;
  if(ex.ut==="sets"){
    const kgs=(block.sets||[]).map(x=>Number(x.kg)||0);
    const vol=(block.sets||[]).reduce((a,x)=>a+(Number(x.kg)||0)*(Number(x.reps)||0),0);
    const maxKg=Math.max(0,...kgs);
    if(maxKg>0&&maxKg>(pr.kg||0)){pr.kg=maxKg;msg="Record de charge sur "+ex.name+" : "+maxKg+" kg !";}
    if(vol>0&&vol>(pr.vol||0)){pr.vol=vol;if(!msg)msg="Record de volume sur "+ex.name+" : "+vol+" kg soulevés !";}
  } else if(ex.ut==="sec"){
    const v=Number(block.sec)||0;
    if(v>0&&v>(pr.sec||0)){pr.sec=v;msg="Record de "+ex.name+" : "+v+" secondes !";}
    if(ex.id==="planche"&&v>=90&&!S.milestones.plank90){S.milestones.plank90=true;save();showCongrats(CONGRATS_MILESTONES.plank90,true);}
  } else if(ex.ut==="nb"){
    const v=Number(block.nb)||0;
    if(v>0&&v>(pr.nb||0)){pr.nb=v;msg="Record de "+ex.name+" : "+v+" reps !";}
  } else {
    const dv=Number(block.dist)||0,mv=Number(block.min)||0;
    if(dv>0&&dv>(pr.dist||0)){pr.dist=dv;msg="Record de distance sur "+ex.name+" : "+dv+" m !";}
    else if(mv>0&&mv>(pr.min||0)){pr.min=mv;msg="Record de durée sur "+ex.name+" : "+mv+" min !";}
  }
  pr.date=todayIso();
  S.prs[ex.id]=pr; save();
  if(msg){ addXP(XP.pr); showCongrats(msg+" +"+XP.pr+" XP. "+pickCongrats(), true); return true; }
  return false;
}

/* ---------- Trophées & Boss ---------- */
function trophyStats(){
  let rowM=0,row40=0,abs=0,vol=0,doneCount=0,pushups=0,before8=0;
  const doneByDay={};
  Object.keys(S.days).forEach(d=>{
    let dCount=0;
    (S.days[d].blocks||[]).forEach(b=>{
      if(b.status!=="fait"&&b.status!=="partiel") return;
      doneCount++; dCount++;
      const ex=exById(b.exId); if(!ex) return;
      if(b.exId.startsWith("rameur")){ rowM+=Number(b.dist)||0; if((Number(b.min)||0)>=40) row40++; }
      if(b.exId==="abdos-classiques"||b.exId==="abdos-lateraux") abs+=Number(b.nb)||0;
      if(b.exId==="pompes") pushups+=Number(b.nb)||0;
      if(ex.ut==="sets") vol+=(b.sets||[]).reduce((a,s)=>a+(Number(s.kg)||0)*(Number(s.reps)||0),0);
      if(b.doneAt){ const hh=Number(b.doneAt.slice(0,2)); if(hh<8) before8++; }
    });
    doneByDay[d]=dCount;
  });
  return {rowM,row40,abs,vol,doneCount,pushups,before8,doneByDay};
}
function checkTrophies(){
  const st=trophyStats();
  const unlock=(id)=>{
    if(S.trophies[id]) return;
    const t=TROPHIES.find(x=>x.id===id);
    S.trophies[id]={date:todayIso()}; save();

  };
  if(Object.keys(S.prs).length>=1||Object.keys(S.raceRecords).length>=1) unlock("first_pr");
  if(st.rowM>=100000) unlock("row_gold");
  if(st.row40>=10) unlock("amphibie");
  if(st.abs>=1000) unlock("millefeuille");
  if(st.vol>=50000) unlock("demenageur");
  if(st.doneCount>=100) unlock("centurion");
  if(st.before8>=10) unlock("dawn10");
  if(st.before8>=1) unlock("early_bird");

  if(curls.some(c=>(S.prs[c]||{}).kg>=14)) unlock("popeye");
  if((S.prs["planche"]||{}).sec>=180) unlock("statue");
  if(currentStreak(todayIso())>=7) unlock("semaine_feu");
  if(streakOf(d=>{const x=S.days[d];return x&&x.water>=12;})>=30) unlock("chameau");
  if(streakOf(d=>{const x=S.days[d];return x&&x.supp&&SUPPLEMENTS.every(s=>x.supp[s.id]);})>=30) unlock("comptable");
  if(Object.values(st.doneByDay).some(n=>n>=8)) unlock("poulpe");
  const weekAgo=addDays(todayIso(),-6);
  if(Object.values(S.prs).filter(p=>p.date&&p.date>=weekAgo).length>=5) unlock("sniper");
  const td=trainedDates();
  for(let i=1;i<td.length;i++){
    if((fromIso(td[i])-fromIso(td[i-1]))/86400000>=7){ unlock("phenix"); break; }
  }
  const w=healthSeries("poids");

  if(w.length>=30) unlock("balance30");

  if(measures>=100) unlock("data100");
  const tset=new Set(td);

    let n=0;
    for(let i=0;i<7;i++){ if(tset.has(addDays(todayIso(),-(wk*7+i)))) n++; }
    if(n>=4) okWeeks++;
  }
  if(okWeeks===4) unlock("metronome");
  if(Object.keys(S.bossDone).length>=3) unlock("boss3");
  if(S.raceRecords[500]&&S.raceRecords[500].sec<105) unlock("chrono500");
  if(S.raceRecords[42195]) unlock("marathonien");
}
function bossForMonth(ymS){

}
function bossProgress(ymS){
  const b=bossForMonth(ymS);
  let v=0;
  const days=Object.keys(S.days).filter(d=>d.startsWith(ymS));
  const activeSet=new Set();
  days.forEach(d=>{
    const day=S.days[d];
    let active=false, strength=false;
    (day.blocks||[]).forEach(bl=>{
      if(bl.status!=="fait"&&bl.status!=="partiel") return;
      active=true;
      const ex=exById(bl.exId); if(!ex) return;
      if(b.metric==="rowKm" && bl.exId.startsWith("rameur")) v+=(Number(bl.dist)||0)/1000;
      if(b.metric==="abs" && (bl.exId==="abdos-classiques"||bl.exId==="abdos-lateraux")) v+=Number(bl.nb)||0;
      if(b.metric==="plankMin" && bl.exId==="planche") v+=(Number(bl.sec)||0)/60;
      if(b.metric==="volume" && ex.ut==="sets") v+=(bl.sets||[]).reduce((a,s)=>a+(Number(s.kg)||0)*(Number(s.reps)||0),0);
      if(b.metric==="pushups" && bl.exId==="pompes") v+=Number(bl.nb)||0;
      if(ex.ut==="sets") strength=true;
    });
    if(active) activeSet.add(d);
    if(b.metric==="strengthDays" && strength) v+=1;
    if(b.metric==="waterDays" && day.water>=12) v+=1;
  });
  if(b.metric==="activeDays") v=activeSet.size;
  return {boss:b, value:v, pct:Math.min(100, v/b.target*100)};
}

/* ---------- Jokers de streak ---------- */
function isPerfectWeek(monday){
  for(let i=0;i<7;i++){
    const dd=addDays(monday,i);
    if(dd>=todayIso()) return false;
    const day=S.days[dd];
    const ok=day&&(day.rest||day.jokerUsed||(day.blocks||[]).some(b=>b.status==="fait"||b.status==="partiel"));
    if(!ok) return false;
  }
  return true;
}
function checkJokerEarn(){
  const cur=weekId(todayIso());
  let run=0;
  for(let k=12;k>=1;k--){
    const m=addDays(cur,-7*k);
    if(m<S.firstUse){ run=0; continue; }
    if(isPerfectWeek(m)) run++; else run=0;
    if(run>0&&run%2===0&&!S.jokerCredits[m]){
      S.jokerCredits[m]=true;
      if((S.jokers||0)<3){ S.jokers=(S.jokers||0)+1; save(); toast("🃏 Joker gagné ! 2 semaines parfaites — ta streak a désormais une assurance ("+S.jokers+"/3)"); }
      else save();
    }
  }
}
function sweepJokers(){
  const start=S.lastSweep||S.firstUse;
  let d=start;
  const y=addDays(todayIso(),-1);
  while(d<=y){
    if(d>=S.firstUse){
      const day=S.days[d];
      const active=day&&((day.blocks||[]).some(b=>b.status==="fait"||b.status==="partiel"));
      const rest=day&&(day.rest||day.jokerUsed);
      if(!active&&!rest&&(S.jokers||0)>0){
        if(!S.days[d]) S.days[d]={blocks:[],rest:false,water:0,supp:{}};
        S.days[d].jokerUsed=true; S.jokers--;
        toast("🃏 Joker consommé pour protéger ta streak ("+fmtShort(d)+") — il t'en reste "+S.jokers);
      }
    }
    d=addDays(d,1);
  }
  S.lastSweep=todayIso(); save();
}

/* ---------- Bilans hebdo & mensuel ---------- */
function weekStats(monday){
  let active=0,prs=0,vol=0,rowKm=0,plankMax=0,races=0;
  for(let i=0;i<7;i++){
    const dd=addDays(monday,i); const day=S.days[dd]; if(!day)continue;
    let act=false;
    (day.blocks||[]).forEach(b=>{
      if(b.status!=="fait"&&b.status!=="partiel") return;
      act=true;
      const ex=exById(b.exId);
      if(ex&&ex.ut==="sets") vol+=(b.sets||[]).reduce((a,s)=>a+(Number(s.kg)||0)*(Number(s.reps)||0),0);
      if(b.exId&&b.exId.startsWith("rameur")) rowKm+=(Number(b.dist)||0)/1000;
      if(b.exId==="planche") plankMax=Math.max(plankMax,Number(b.sec)||0);
    });
    if(act) active++;
  }
  const end=addDays(monday,6);
  Object.values(S.prs).forEach(p=>{ if(p.date&&p.date>=monday&&p.date<=end) prs++; });
  Object.values(S.raceRecords).forEach(r=>{ if(r.date>=monday&&r.date<=end) races++; });
  const w=healthSeries("poids"); let dW=null;
  if(w.length>=2){
    const it=interpolate(w);
    const a=it.find(p=>p.d>=monday);
    const b2=[...it].reverse().find(p=>p.d<=end);
    if(a&&b2&&b2.d>a.d) dW=b2.v-a.v;
  }
  return {active,prs:prs+races,vol,rowKm,plankMax,dW};
}
function weekGrade(ws){
  const s=ws.active*12+ws.prs*6+(ws.dW!==null&&ws.dW<=0?16:0)+(ws.rowKm>=8?8:0);

const FUND_POCKETS=[
  {id:"pecs",    name:"Pectoraux",    emoji:"🛡️"},
  {id:"epaules", name:"Épaules",      emoji:"🏔️"},
  {id:"bras",    name:"Bras",         emoji:"💪"},
  {id:"dos",     name:"Dos",          emoji:"🦅"},
  {id:"jambes",  name:"Jambes",       emoji:"🦵"},

function pocketsFor(ex){
  const n=(ex.name||"").toLowerCase(), c=ex.cat;
  if(c==="Cardio"||n.includes("rameur")||n.includes("tennis")) return ["cardio"];
  if(n.includes("pompes")) return ["pecs","bras"];
  if(c==="Poussée"){
    if(n.includes("militaire")||n.includes("arnold")||n.includes("elevation")||n.includes("élévation")) return ["epaules"];
    if(n.includes("triceps")||n.includes("kickback")) return ["bras"];
    return ["pecs"];
  }
  if(c==="Tirage"){
    if(n.includes("curl")) return ["bras"];
    return ["dos"];
  }
  if(c==="Jambes/Fessiers"){
    if(n.includes("hip")) return ["fessiers"];
    if(n.includes("fente")||n.includes("sumo")||n.includes("souleve")||n.includes("soulevé")) return ["jambes","fessiers"];
    if(n.includes("mollets")) return ["jambes"];
    return ["jambes"];
  }
  if(c==="Gainage") return ["gainage"];
  if(c==="Corps Entier") return ["epaules","dos","jambes"];
  return ["gainage"];
}
function toDateMap(series){ const m={}; series.forEach(p=>m[p.d]=p.v); return m; }
function fundSeries(){
  const dayKeys=Object.keys(S.days).sort();
  if(!dayKeys.length) return null;
  const start=dayKeys[0], today=todayIso();
  const prices={}, lastHit={};
  FUND_POCKETS.forEach(p=>{prices[p.id]=100;lastHit[p.id]=start;});
  const prByDate={};
  Object.entries(S.prs).forEach(([id,pr])=>{
    if(!pr.date) return;
    const ex=exById(id); if(!ex) return;
    (prByDate[pr.date]=prByDate[pr.date]||[]).push(...pocketsFor(ex));
  });
  Object.entries(S.raceRecords).forEach(([d,r])=>{ if(r.date)(prByDate[r.date]=prByDate[r.date]||[]).push("cardio"); });
  const wM=toDateMap(interpolate(healthSeries("poids")));
  const fcM=toDateMap(interpolate(healthSeries("fc")));
  const mgM=toDateMap(interpolate(healthSeries("mg")));
  let healthMult=1, prevW=null, prevFc=null, prevMg=null;
  const out=[];
  let d=start;
  while(d<=today){
    const day=S.days[d];
    const vol={}; 
    if(day)(day.blocks||[]).forEach(b=>{
      if(b.status!=="fait"&&b.status!=="partiel") return;
      const ex=exById(b.exId); if(!ex) return;
      const f=b.status==="partiel"?0.5:1;
      let load=0;
      if(ex.ut==="sets") load=f*(b.sets||[]).reduce((a,s)=>a+(Number(s.kg)||0)*(Number(s.reps)||0),0);
      else if(ex.ut==="sec") load=f*(Number(b.sec)||0)*2;
      else if(ex.ut==="nb") load=f*(Number(b.nb)||0)*3;
      else load=f*(Number(b.min)||0)*12;
      const pk=pocketsFor(ex);
      pk.forEach(pid=>{vol[pid]=(vol[pid]||0)+load/pk.length;});
    });
    FUND_POCKETS.forEach(p=>{
      let ret=0;
      const v=vol[p.id]||0;
      if(v>0){ ret+=Math.min(0.028, Math.log1p(v/300)*0.022); lastHit[p.id]=d; }
      else { const gap=Math.round((fromIso(d)-fromIso(lastHit[p.id]))/86400000); if(gap>4) ret-=0.004; }
      if((prByDate[d]||[]).includes(p.id)) ret+=0.02;
      prices[p.id]=Math.max(40, Math.min(400, prices[p.id]*(1+ret)));
    });
    let macro=0;
    if(wM[d]!==undefined){ if(prevW!==null) macro+=(prevW-wM[d])*0.006; prevW=wM[d]; }
    if(fcM[d]!==undefined){ if(prevFc!==null) macro+=(prevFc-fcM[d])*0.0012; prevFc=fcM[d]; }
    if(mgM[d]!==undefined){ if(prevMg!==null) macro+=(prevMg-mgM[d])*0.004; prevMg=mgM[d]; }
    healthMult=Math.max(0.6, Math.min(1.8, healthMult*(1+macro)));
    const base=FUND_POCKETS.reduce((a,p)=>a+prices[p.id],0)/FUND_POCKETS.length;
    out.push({d, nav:Number((base*healthMult).toFixed(2)), pockets:{...prices}, hm:healthMult});
    d=addDays(d,1);
  }
  return out;
}
function fundPerf(series,nDays){
  if(!series||series.length<2) return null;
  const last=series[series.length-1];
  const idx=Math.max(0, series.length-1-nDays);
  const ref=series[idx];
  if(!ref||ref.nav===0) return null;
  return (last.nav/ref.nav-1)*100;
}
function fundDrawdown(series){
  let peak=-Infinity, dd=0, from=null, peakD=null, ddFrom=null, ddTo=null;
  series.forEach(p=>{
    if(p.nav>peak){peak=p.nav;peakD=p.d;}
    const cur=(p.nav/peak-1)*100;
    if(cur<dd){dd=cur;ddFrom=peakD;ddTo=p.d;}
  });
  return {dd, from:ddFrom, to:ddTo};
}
function fundVol(series,nDays){
  const s=series.slice(-nDays-1);
  if(s.length<8) return null;
  const rets=[];
  for(let i=1;i<s.length;i++) rets.push(s[i].nav/s[i-1].nav-1);
  const mean=rets.reduce((a,b)=>a+b,0)/rets.length;
  const varr=rets.reduce((a,b)=>a+(b-mean)*(b-mean),0)/rets.length;
  return Math.sqrt(varr)*Math.sqrt(365)*100;
}
function pocketPerf(series,pid,nDays){
  if(!series||series.length<2) return null;
  const last=series[series.length-1].pockets[pid];
  const idx=Math.max(0, series.length-1-nDays);
  const ref=series[idx].pockets[pid];
  if(!ref) return null;
  return (last/ref-1)*100;
}

function setStatus(i,st){
  const d=getDay(CUR_DATE,true);const b=d.blocks[i];
  const prev=b.status;
  b.status=(b.status===st)?null:st;
  if(b.status==="fait"||b.status==="partiel"){
    const now=new Date();
    b.doneAt=String(now.getHours()).padStart(2,"0")+":"+String(now.getMinutes()).padStart(2,"0");
  }
  if(b.exId==="rameur-course"&&b.race&&(b.status==="fait"||b.status==="partiel")){
    const totMin=(Number(b.rh)||0)*60+(Number(b.rmin)||0)+((Number(b.rsec)||0)+(Number(b.rcc)||0)/100)/60;
    if(totMin>0) b.min=String(Math.round(totMin*10)/10);
    b.dist=String(b.race);
  }
  save();
  const ex=exById(b.exId);
  if(b.status==="fait"&&prev!=="fait"){
    addXP(XP.fait);
    if(ex&&b.exId==="rameur-course"&&(Number(b.min)||0)>=40) addXP(XP.longRow);
    let isPR=false;
    if(b.exId==="rameur-course"&&b.race){ isPR=checkRaceRecord(b); }
    else { isPR=checkPR(b); }
    if(!isPR&&Math.random()<0.3) toast("✓ +"+XP.fait+" XP · "+pickCongrats());
    if(d.blocks.length&&d.blocks.every(x=>x.status)){
      if(!d.bonusGiven){d.bonusGiven=true;save();addXP(XP.dayComplete);toast("🏁 Journée bouclée ! +"+XP.dayComplete+" XP bonus");}
    }
    checkStreakMilestones();checkTrophies();checkBoss();
    if(ex&&(ex.ut==="sets"||ex.ut==="sec"||ex.ut==="nb")) openFeedback(i);
  }
  else if(b.status==="partiel"&&prev!=="partiel"){
    addXP(XP.partiel);toast("Séance partielle > canapé complet 👊 +"+XP.partiel+" XP");
    checkStreakMilestones();checkBoss();
    if(ex&&(ex.ut==="sets"||ex.ut==="sec"||ex.ut==="nb")) openFeedback(i);
  }
  render();
  if(FOCUS.active)renderFocus();
}

/* timers + voix */
let TIMER=null,TIMER_T=0,TIMER_DIR=-1;
function tickTimer(){
  TIMER_T+=TIMER_DIR;
  tickShow();
  if(TIMER_DIR===1){
    if(TIMER_T>0&&TIMER_T%10===0){
      let msg=TIMER_T+" secondes";
      if(TIMER_T%30===0) msg+=". "+ENC[Math.floor(Math.random()*ENC.length)];
      say(msg);
    }
  } else {
    if(TIMER_T===30||TIMER_T===20) say(TIMER_T+" secondes");
    else if(TIMER_T===10) say("10 secondes, prépare-toi");
    if(TIMER_T<=0){stopTimer();beep();say("C'est reparti, on y va !");toast("⏱ Repos terminé, on y retourne !");}
  }
}
function startTimer(sec){stopTimer();TIMER_T=sec;TIMER_DIR=-1;tickShow();TIMER=setInterval(tickTimer,1000);}
function startPlank(){stopTimer();TIMER_T=0;TIMER_DIR=1;tickShow();TIMER=setInterval(tickTimer,1000);beep();say("C'est parti !");}
function tickShow(){["timerDisp","ftimer"].forEach(id=>{const el=document.getElementById(id);if(el){const m=Math.floor(Math.abs(TIMER_T)/60),s=Math.abs(TIMER_T)%60;el.textContent=m+":"+String(s).padStart(2,"0");}});}
function stopTimer(){if(TIMER){clearInterval(TIMER);TIMER=null;if(TIMER_DIR===1)beep();}}
function beep(){try{const ctx=new(window.AudioContext||window.webkitAudioContext)();const o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.value=880;g.gain.value=.15;o.start();setTimeout(()=>{o.stop();ctx.close();},220);}catch(e){}}

/* Photos — IndexedDB */
let _pdb=null;
function idb(){ return new Promise((res,rej)=>{
  if(_pdb) return res(_pdb);
  if(typeof indexedDB==="undefined") return rej(new Error("no idb"));
  const q=indexedDB.open("reprise-photos",1);
  q.onupgradeneeded=e=>{e.target.result.createObjectStore("photos",{keyPath:"id"});};
  q.onsuccess=e=>{_pdb=e.target.result;res(_pdb);};
  q.onerror=()=>rej(q.error);
});}
function addPhoto(input){
  const f=input.files&&input.files[0]; if(!f) return;
  f.arrayBuffer().then(buf=>idb().then(db=>new Promise((res,rej)=>{
    const tx=db.transaction("photos","readwrite");
    tx.objectStore("photos").put({id:Date.now(), date:todayIso(), type:f.type, buf});
    tx.oncomplete=res; tx.onerror=rej;
  }))).then(()=>{toast("📸 Photo ajoutée à ton évolution");renderPhotos();})
  .catch(()=>toast("⚠️ Impossible d'enregistrer la photo"));
  input.value="";
}
function getPhotos(){ return idb().then(db=>new Promise(res=>{
  const r=db.transaction("photos").objectStore("photos").getAll();
  r.onsuccess=()=>res((r.result||[]).sort((a,b)=>a.id-b.id));
  r.onerror=()=>res([]);
})).catch(()=>[]); }
function delPhoto(id){ idb().then(db=>{const tx=db.transaction("photos","readwrite");tx.objectStore("photos").delete(id);tx.oncomplete=()=>{PH_SEL=PH_SEL.filter(x=>x!==id);renderPhotos();};}); }
function photoURL(p){ return URL.createObjectURL(new Blob([p.buf],{type:p.type||"image/jpeg"})); }
function renderPhotos(){
  const grid=document.getElementById("photoGrid");

    PH_CACHE=list;

function heatColor(l){return ["#1a2332","#12492c","#1d8a4e","#34d17b"][l];}
function heatmapSVG(){
  const weeks=26, cell=15, gap=3;
  const today=todayIso();
  const todayDow=(fromIso(today).getDay()+6)%7;
  const start=addDays(today,-(weeks-1)*7-todayDow);
  const loads=[];
  for(let w=0;w<weeks;w++)for(let dw=0;dw<7;dw++){
    const d=addDays(start,w*7+dw);
    if(d>today)continue;
    loads.push({d,w,dw,v:S.days[d]?dayLoad(S.days[d]):0});
  }
  const max=Math.max(1,...loads.map(x=>x.v));
  let svg='<svg width="'+(weeks*(cell+gap)+30)+'" height="'+(7*(cell+gap)+18)+'">';
  ["L","M","M","J","V","S","D"].forEach((l,i)=>{svg+='<text x="2" y="'+(i*(cell+gap)+11)+'">'+l+'</text>';});
  loads.forEach(o=>{
    const lvl=o.v===0?0:(o.v<max*0.33?1:(o.v<max*0.66?2:3));
    const rest=S.days[o.d]&&(S.days[o.d].rest||S.days[o.d].jokerUsed);
    svg+='<rect x="'+(o.w*(cell+gap)+22)+'" y="'+(o.dw*(cell+gap))+'" width="'+cell+'" height="'+cell+'" rx="3.5" fill="'+(rest?"#2b3a52":heatColor(lvl))+'"'+(o.d===today?' stroke="#f0c53d" stroke-width="1.5"':'')+'/>';
  });
  let lastM=-1;
  for(let w=0;w<weeks;w++){
    const d=fromIso(addDays(start,w*7));
    if(d.getMonth()!==lastM){lastM=d.getMonth();svg+='<text x="'+(w*(cell+gap)+22)+'" y="'+(7*(cell+gap)+13)+'">'+MONTHS[lastM]+'</text>';}
  }
  svg+='</svg>';
  return svg;
}
function streakOf(fn){
  let n=0,d=todayIso();
  if(!fn(d))d=addDays(d,-1);
  while(fn(d)){n++;d=addDays(d,-1);if(n>999)break;}
  return n;
}

function statsCardio(){
  let html='<h2 style="margin-top:0">⏱ Records rameur — courses</h2><div class="card tight" style="overflow-x:auto"><table class="healthlist">'
    +'<tr><th>Distance</th><th>Toi</th><th>/500m</th><th>Ergatta</th><th></th></tr>';
  raceDistances().forEach(d=>{
    const r=S.raceRecords[d];
    const e=S.ergattaRecords[d];
    const pace=r? fmtTime(r.sec/d*500):"—";
    const crown=(r&&e&&r.sec<e.sec)?" 👑":"";
    html+='<tr><td><b>'+fmtDist(d)+'</b></td>'
      +'<td>'+(r?'<b style="color:var(--gold)">'+fmtTime(r.sec)+'</b>'+crown+'<span class="muted small"> · '+fmtShort(r.date)+'</span>':'<span class="dim">—</span>')+'</td>'
      +'<td>'+pace+'</td>'
      +'<td>'+(e?fmtTime(e.sec):'<span class="dim">—</span>')+'</td>'
      +'<td><a onclick="openRaceEdit('+d+')">✎</a></td></tr>';
  });
  html+='</table>'
    +'<button class="btn ghost" style="width:100%;margin-top:10px" onclick="openRaceAdd()">+ Ajouter une distance</button>'
    +'<div class="muted small" style="margin-top:8px">✎ pour saisir ton record et le record de la plateforme Ergatta. 👑 = record Ergatta battu. En séance « Rameur - Course », battre ton chrono déclenche la célébration (+25 XP).</div></div>';
  const rows=[];
  Object.keys(S.days).sort().forEach(d=>{
    (S.days[d].blocks||[]).forEach(b=>{
      if(!b.exId||!b.exId.startsWith("rameur"))return;
      if(b.status!=="fait"&&b.status!=="partiel")return;
      rows.push({d,min:Number(b.min)||0,dist:Number(b.dist)||0});
    });
  });
  if(!rows.length)return html+'<div class="emptymsg">Valide des séances de rameur pour voir tes courbes : distance, allure, volume hebdo.</div>';
  const totKm=rows.reduce((a,r)=>a+r.dist,0)/1000;
  const totMin=rows.reduce((a,r)=>a+r.min,0);
  const withPace=rows.filter(r=>r.min>0&&r.dist>0);
  const bestPace=withPace.length?Math.min(...withPace.map(r=>r.min/(r.dist/500))):null;
  html+='<div class="tiles" style="margin-bottom:12px">'
    +'<div class="tile"><div class="v">'+totKm.toFixed(1)+'<span style="font-size:.8rem"> km</span></div><div class="l">Distance totale</div></div>'
    +'<div class="tile"><div class="v">'+Math.round(totMin)+'<span style="font-size:.8rem"> min</span></div><div class="l">Temps total</div></div>'
    +'<div class="tile"><div class="v">'+rows.length+'</div><div class="l">Séances</div></div>'
    +'<div class="tile"><div class="v">'+(bestPace?bestPace.toFixed(2):"—")+'<span style="font-size:.8rem"> min/500m</span></div><div class="l">Meilleure allure</div></div></div>';
  const byWeek={};
  rows.forEach(r=>{
    const wk=weekId(r.d);
    byWeek[wk]=(byWeek[wk]||0)+r.dist/1000;
  });
  const wpts=Object.keys(byWeek).sort().map(k=>({d:k,v:Number(byWeek[k].toFixed(1))}));
  if(wpts.length>=2){
    html+='<h2>🚣 Km par semaine</h2><div class="card chartwrap">'+chartLines([{pts:wpts,color:"#4da3ff",w:2.5}],{})+'</div>';
  }
  const paces=withPace.map(r=>({d:r.d,v:Number((r.min/(r.dist/500)).toFixed(2))}));
  if(paces.length>=2){
    html+='<h2>⚡ Allure (min / 500 m) — plus bas = plus rapide</h2><div class="card chartwrap">'+chartLines([{pts:paces,color:"#34d17b",w:2}],{})+'</div>';
  }
  return html;
}
function openRaceEdit(dist){
  const r=S.raceRecords[dist];
  const e=S.ergattaRecords[dist];
  const split=(rec)=>{
    if(!rec) return {h:"",m:"",s:"",c:""};
    const t=rec.sec;
    const h=Math.floor(t/3600), m=Math.floor(t%3600/60), s=Math.floor(t%60), c=Math.round((t-Math.floor(t))*100);
    return {h:h||"", m, s, c:c||""};
  };
  const a=split(r), b=split(e);
  const isCustom=!RACE_DISTANCES.includes(Number(dist));
  const rowT=(pfx,v)=>'<div class="setrow"><span class="lbl">h</span><input type="number" inputmode="numeric" id="'+pfx+'H" value="'+v.h+'" placeholder="h">'
    +'<span class="lbl">min</span><input type="number" inputmode="numeric" id="'+pfx+'Min" value="'+v.m+'" placeholder="min">'
    +'<span class="lbl">sec</span><input type="number" inputmode="numeric" id="'+pfx+'Sec" value="'+v.s+'" placeholder="sec">'
    +'<span class="lbl">/100</span><input type="number" inputmode="numeric" id="'+pfx+'Cc" value="'+v.c+'" placeholder="cc"></div>';
  const html='<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal">'
    +'<h3>⏱ '+fmtDist(dist)+(isCustom?' <span class="muted small">(distance perso)</span>':'')+'</h3>'
    +'<label class="f">🥇 Ton record</label>'+rowT("re",a)
    +'<label class="f">🏆 Record plateforme Ergatta</label>'+rowT("eg",b)
    +'<div class="muted small" style="margin-top:6px">Saisies manuelles = références, sans XP. La gloire (et les +25 XP) viennent en les battant en séance.</div>'
    +'<div class="row" style="gap:8px;margin-top:14px;flex-wrap:wrap">'
    +'<button class="btn primary grow" onclick="saveRaceEdit('+dist+')">Enregistrer</button>'
    +(r?'<button class="btn" style="color:var(--bad)" onclick="if(confirm(\'Effacer ton record ?\')){delete S.raceRecords['+dist+'];save();closeModal();render()}">Effacer le mien</button>':'')
    +(isCustom?'<button class="btn" style="color:var(--bad)" onclick="if(confirm(\'Supprimer cette distance et ses records ?\')){delRaceDist('+dist+')}">Supprimer la distance</button>':'')
    +'<button class="btn" onclick="closeModal()">Annuler</button></div></div></div>';
  document.getElementById("modalRoot").innerHTML=html;
}
function readT(pfx){
  const g=id=>Number(document.getElementById(pfx+id).value)||0;
  return g("H")*3600+g("Min")*60+g("Sec")+Math.min(99,Math.max(0,g("Cc")))/100;
}
function saveRaceEdit(dist){
  const mine=readT("re"), erg=readT("eg");
  if(mine<=0&&erg<=0){toast("Aucun chrono saisi");return;}
  if(mine>0) S.raceRecords[dist]={sec:mine,date:(S.raceRecords[dist]&&S.raceRecords[dist].date)||todayIso()};
  else delete S.raceRecords[dist];
  if(erg>0) S.ergattaRecords[dist]={sec:erg};
  else delete S.ergattaRecords[dist];
  save();closeModal();
  toast("⏱ Enregistré — "+fmtDist(dist)+(mine>0?" · toi : "+fmtTime(mine):"")+(erg>0?" · Ergatta : "+fmtTime(erg):""));
  checkTrophies();render();
}

function addRaceDist(){
  const d=Math.round(Number(document.getElementById("newDist").value)||0);
  if(d<=0){toast("Distance invalide");return;}
  if(raceDistances().includes(d)){toast(fmtDist(d)+" existe déjà");closeModal();return;}
  S.customRaceDistances.push(d);save();closeModal();render();
  toast("🏁 "+fmtDist(d)+" ajoutée — à toi de poser la référence");
  openRaceEdit(d);
}
function delRaceDist(d){
  S.customRaceDistances=S.customRaceDistances.filter(x=>Number(x)!==Number(d));
  delete S.raceRecords[d];delete S.ergattaRecords[d];
  save();closeModal();render();
}

function savePrEdit(exId){
  const ex=exById(exId); if(!ex) return;
  const g=id=>{const el=document.getElementById(id);return el?Number(el.value)||0:0;};
  const pr=S.prs[exId]||{};
  let any=false;
  if(ex.ut==="sets"){ const kg=g("prKg"),vol=g("prVol");
    if(kg>0){pr.kg=kg;any=true;} else delete pr.kg;
    if(vol>0){pr.vol=vol;any=true;} else delete pr.vol; }
  else if(ex.ut==="sec"){ const s=g("prSec"); if(s>0){pr.sec=s;any=true;} else delete pr.sec; }
  else if(ex.ut==="nb"){ const n=g("prNb"); if(n>0){pr.nb=n;any=true;} else delete pr.nb; }
  else { const d=g("prDist"),m=g("prMin");
    if(d>0){pr.dist=d;any=true;} else delete pr.dist;
    if(m>0){pr.min=m;any=true;} else delete pr.min; }
  if(!any){ delete S.prs[exId]; save(); closeModal(); render(); return; }
  pr.date=pr.date||todayIso();
  S.prs[exId]=pr; save(); closeModal();
  toast("🏅 Record enregistré : "+prText(ex,pr));
  checkTrophies(); STATS_TAB="force"; render();
}

function chartLines(series,opts){
  const W=520,H=200,P={l:38,r:10,t:12,b:24};
  let all=[];
  series.forEach(s=>all=all.concat(s.pts));
  if(!all.length)return "";
  const ds=[...new Set(all.map(p=>p.d))].sort();
  const d0=fromIso(ds[0]).getTime(), d1=fromIso(ds[ds.length-1]).getTime();
  const span=Math.max(1,d1-d0);
  let vmin=Math.min(...all.map(p=>p.v)), vmax=Math.max(...all.map(p=>p.v));
  if(opts.goal!==undefined){vmin=Math.min(vmin,opts.goal);vmax=Math.max(vmax,opts.goal);}
  const pad=(vmax-vmin)*0.1||1;vmin-=pad;vmax+=pad;
  const X=d=>P.l+(fromIso(d).getTime()-d0)/span*(W-P.l-P.r);
  const Y=v=>P.t+(1-(v-vmin)/(vmax-vmin))*(H-P.t-P.b);
  let svg='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto">';
  for(let i=0;i<=3;i++){
    const v=vmin+(vmax-vmin)*i/3;
    svg+='<line x1="'+P.l+'" y1="'+Y(v)+'" x2="'+(W-P.r)+'" y2="'+Y(v)+'" stroke="#263243" stroke-width="1"/>'
      +'<text x="2" y="'+(Y(v)+3)+'">'+v.toFixed(1)+'</text>';
  }
  if(opts.goal!==undefined)
    svg+='<line x1="'+P.l+'" y1="'+Y(opts.goal)+'" x2="'+(W-P.r)+'" y2="'+Y(opts.goal)+'" stroke="#f0c53d" stroke-width="1.5" stroke-dasharray="5,4"/>';
  series.forEach(s=>{
    if(s.pts.length<2)return;
    let path="M";
    s.pts.forEach((p,i)=>{path+=(i?" L":" ")+X(p.d).toFixed(1)+" "+Y(p.v).toFixed(1);});
    svg+='<path d="'+path+'" fill="none" stroke="'+s.color+'" stroke-width="'+(s.w||2)+'" stroke-linejoin="round" stroke-linecap="round"/>';
  });
  const lastP=series[series.length-1].pts;
  if(lastP.length){
    const lp=lastP[lastP.length-1];
    svg+='<circle cx="'+X(lp.d)+'" cy="'+Y(lp.v)+'" r="4" fill="'+series[series.length-1].color+'"/>';
  }
  [ds[0],ds[ds.length-1]].forEach(d=>{
    svg+='<text x="'+(X(d)-14)+'" y="'+(H-6)+'">'+fmtShort(d)+'</text>';
  });
  svg+='</svg>';
  return svg;
}

    +'<div class="row" style="gap:8px;margin-top:14px">'
    +'<button class="btn primary grow" onclick="saveExo('+(id?"'"+id+"'":"null")+')">Enregistrer</button>'
    +(id?'<button class="btn" style="color:var(--bad)" onclick="delExo(\''+id+'\')">Supprimer</button>':'')
    +'<button class="btn" onclick="closeModal()">Annuler</button></div></div></div>';
  document.getElementById("modalRoot").innerHTML=html;
}
function saveExo(id){
  const name=document.getElementById("exName").value.trim();
  if(!name){toast("Nom requis");return;}
  const data={
    name, cat:document.getElementById("exCat").value,
    muscles:document.getElementById("exMus").value.trim(),
    ut:document.getElementById("exUt").value,
    yt:document.getElementById("exYt").value.trim()
  };
  if(data.ut==="min")data.dist=true;
  if(id){Object.assign(exById(id),data);}
  else{
    const nid=name.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
    if(exById(nid)){toast("Un exercice avec ce nom existe déjà");return;}
    S.exercises.push({id:nid,...data});
  }
  save();closeModal();render();toast("✓ Exercice enregistré");
}
function delExo(id){
  if(!confirm("Supprimer cet exercice de la bibliothèque ? L'historique des séances passées est conservé."))return;
  S.exercises=S.exercises.filter(e=>e.id!==id);
  Object.keys(S.template).forEach(k=>{S.template[k]=S.template[k].filter(x=>x!==id);});
  save();closeModal();render();
}
function exportJSON(){
  dl("reprise-export-"+todayIso()+".json", JSON.stringify(S,null,1), "application/json");
}
function exportCSV(){
  let csv="date;exercice;statut;detail\n";
  Object.keys(S.days).sort().forEach(d=>{
    (S.days[d].blocks||[]).forEach(b=>{
      const ex=exById(b.exId);if(!ex||!b.status)return;
      let det="";
      if(ex.ut==="sets")det=(b.sets||[]).map(s=>(s.reps||"?")+"x"+(s.kg||"?")+"kg").join(" | ");
      else if(ex.ut==="sec")det=(b.sec||"")+" sec";
      else if(ex.ut==="nb")det=(b.nb||"")+" reps";
      else{det=(b.min||"")+" min";if(b.dist)det+=" / "+b.dist+" m";}
      csv+=d+";"+ex.name+";"+b.status+";"+det+"\n";
    });
  });
  csv+="\ndate;poids;fc;mm;mg;gv;imc;tmb;ageMet\n";
  Object.keys(S.health).sort().forEach(d=>{
    const h=S.health[d];
    csv+=d+";"+(h.poids??"")+";"+(h.fc??"")+";"+(h.mm??"")+";"+(h.mg??"")+";"+(h.gv??"")+";"+(h.imc??"")+";"+(h.tmb??"")+";"+(h.ageMet??"")+"\n";
  });
  csv+="\ndistance_m;record_sec;date;ergatta_sec\n";
  raceDistances().forEach(dd=>{
    const r=S.raceRecords[dd], e=S.ergattaRecords[dd];
    if(r||e)csv+=dd+";"+(r?r.sec:"")+";"+(r?r.date:"")+";"+(e?e.sec:"")+"\n";
  });
  dl("reprise-export-"+todayIso()+".csv", csv, "text/csv");
}
function dl(name,content,mime){
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([content],{type:mime}));
  a.download=name;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),3000);
}
function importJSON(input){
  const f=input.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const data=JSON.parse(r.result);
      if(!data.days||!data.exercises)throw new Error("format");
      if(!confirm("Remplacer toutes les données actuelles par cet import ?"))return;
      localStorage.setItem(LS_KEY, JSON.stringify(data));
      load();
      toast("✓ Import réussi");
      render();
    }catch(e){toast("⚠️ Fichier invalide");}
  };
  r.readAsText(f);
}
